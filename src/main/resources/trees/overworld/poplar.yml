Blocks:

  # Here you can add extra blocks that can be expected inside or around tree leaves
  Materials:
  - minecraft:red_poplar_leaves
  - minecraft:orange_poplar_leaves
  - minecraft:yellow_poplar_leaves
  Top:

    # Radius around the trunk to check for leaves
    Radius: 2
  Custom Drops:

    # Drop chances for extra drops. 1.0 would be 100% chance!
    Items:
      minecraft:red_poplar_leaves: 0.01
      minecraft:orange_poplar_leaves: 0.01
      minecraft:yellow_poplar_leaves: 0.01

# The parent tree config to inherit from, recursively
Parent: default

# The permission required for this tree type
Permission: treeassist.destroy.poplar
Replanting:

  # How far down do we look for saplings to place them
  Check Depth: 14

  # The material to place
  Material: minecraft:poplar_sapling
Trunk:
  Branch: true

  # One of these materials needs to be part of the trunk for it to count as a trunk
  Materials:
  - minecraft:poplar_log
  - minecraft:stripped_poplar_log

Natural Blocks:
  - 'minecraft:shelf_mushroom'
Ground Blocks:
  - 'minecraft:podzol'
  - 'minecraft:mycelium'
  - 'minecraft:grass_block'
  - 'minecraft:dirt'
  - 'minecraft:coarse_dirt'
  - 'minecraft:sand'
  - 'minecraft:pale_moss_block'
  - 'minecraft:rooted_dirt'
  - 'minecraft:moss_block'
  - 'minecraft:farmland'
  - 'minecraft:mud'
  - 'minecraft:muddy_mangrove_roots'

# Version number for automagical config updates
Version: 7.3072
